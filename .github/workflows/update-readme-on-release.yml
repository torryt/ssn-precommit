name: Update README version

on:
  release:
    types: [published]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version in README
        run: |
          sed -i "s/rev: v[0-9]\+\.[0-9]\+\.[0-9]\+/rev: ${{ github.event.release.tag_name }}/" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update README to ${{ github.event.release.tag_name }}"
          git push
